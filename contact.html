<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contactez Moi</title>

<link rel="stylesheet" href="css/styles.css">

<style>
body { font-family: Arial; }

/* 🔥 SPINNER */
.spinner {
  width:40px;
  height:40px;
  border:5px solid #ddd;
  border-top:5px solid #6c63ff;
  border-radius:50%;
  animation: spin 1s linear infinite;
  margin:auto;
}

@keyframes spin {
  100% { transform: rotate(360deg); }
}

/* loader + success */
#loader, #successBox {
  display:none;
  text-align:center;
  margin-top:10px;
}

/* ✔ SUCCESS ANIMATION */
.checkmark {
  font-size:60px;
  color:green;
  animation: pop 0.5s ease-in-out;
}

@keyframes pop {
  0% { transform: scale(0); }
  100% { transform: scale(1); }
}

/* 📞 CONTACT CARD */
.contact-card {
  margin-top:40px;
  padding:15px;
  border:1px solid #ddd;
  border-radius:10px;
}
</style>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.4/firebase-app.js";
import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.4/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyAqndA1abN4wy-uCTKyProhdxzm4_mR2Xk",
  authDomain: "virtuel-comptable.firebaseapp.com",
  projectId: "virtuel-comptable",
  storageBucket: "virtuel-comptable.firebasestorage.app",
  messagingSenderId: "192881285900",
  appId: "1:192881285900:web:0b83de32611d1a72194729"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

// 🔥 ANTI-SPAM
let lastSendTime = 0;

window.sendMessage = async function(event){
  event.preventDefault();

  const now = Date.now();
  if(now - lastSendTime < 5000){
    alert("⛔ Please wait 5 seconds before sending again");
    return;
  }
  lastSendTime = now;

  const name = document.getElementById("name").value;
  const email = document.getElementById("email").value;
  const message = document.getElementById("message").value;

  const btn = document.getElementById("sendBtn");
  const loader = document.getElementById("loader");
  const successBox = document.getElementById("successBox");

  if(!name || !email || !message){
    alert("Fill all fields");
    return;
  }

  btn.disabled = true;
  loader.style.display = "block";
  successBox.style.display = "none";

  try {
    await addDoc(collection(db, "contacts"), {
      name,
      email,
      message,
      createdAt: serverTimestamp()
    });

    loader.style.display = "none";
    successBox.style.display = "block";

    document.getElementById("contactForm").reset();

    // 🔥 AUTO REDIRECT
    setTimeout(()=>{
      window.location.href = "index.html";
    }, 3000);

  } catch (error) {
    console.error(error);
    alert("Error sending message ❌");
  }

  btn.disabled = false;
};

</script>

</head>

<body>

<header>
  <h1>Contact</h1>
</header>

<main>

<!-- 🔥 FORM -->
<form id="contactForm" onsubmit="sendMessage(event)">

  <input type="text" id="name" placeholder="Name" required><br><br>
  <input type="email" id="email" placeholder="Email" required><br><br>
  <textarea id="message" placeholder="Message" required></textarea><br><br>

  <button id="sendBtn" type="submit">Envoyer</button>

  <!-- 🔥 LOADER -->
  <div id="loader">
    <div class="spinner"></div>
    <p>Sending...</p>
  </div>

  <!-- ✔ SUCCESS -->
  <div id="successBox">
    <div class="checkmark">✔</div>
    <p>Message sent successfully!</p>
  </div>

</form>

<!-- 📞 CONTACT DIRECT (RE-ADDED) -->

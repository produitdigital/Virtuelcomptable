<!DOCTYPE html>
<html lang="fr">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Contact | Assistant Virtuel en Comptabilité</title>

<meta name="description" content="Contactez un assistant virtuel en comptabilité pour vos besoins en gestion financière, tenue de livre et assistance administrative professionnelle.">

<meta name="robots" content="index, follow">

<link rel="canonical" href="https://virtuel-comptable.web.app/contact">

<link rel="stylesheet" href="css/styles.css">

<!-- Open Graph -->
<meta property="og:title" content="Contact Assistant Virtuel Comptable">
<meta property="og:description" content="Contactez-moi pour vos besoins en comptabilité et gestion financière.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://virtuel-comptable.web.app/contact">

</head>

<body>

<header>
  <h1>Contactez-moi</h1>

  <p>
    Besoin d’un assistant virtuel comptable ? Envoyez-moi un message.
  </p>
</header>

<main>

<!-- FORM -->
<form id="contactForm" onsubmit="sendMessage(event)">

  <input type="text" id="name" placeholder="Nom complet" required><br><br>

  <input type="email" id="email" placeholder="Email" required><br><br>

  <textarea id="message" placeholder="Votre message..." required></textarea><br><br>

  <button id="sendBtn" type="submit">Envoyer</button>

  <!-- LOADER -->
  <div id="loader">
    <div class="spinner"></div>
    <p>Envoi en cours...</p>
  </div>

  <!-- SUCCESS -->
  <div id="successBox">
    <div class="checkmark">✔</div>
    <p>Message envoyé avec succès !</p>
  </div>

</form>

<!-- CONTACT INFO -->
<section class="contact-card">

  <h2>📞 Contact direct</h2>

  <p>Email :
    <a href="mailto:rjeantsioriniaina@gmail.com">
      rjeantsioriniaina@gmail.com
    </a>
  </p>

  <p>Téléphone :
    <a href="tel:+261380806430">
      +261 38 08 064 30
    </a>
  </p>

  <p>WhatsApp :
    <a href="https://wa.me/261380806430" target="_blank">
      Envoyer un message
    </a>
  </p>

</section>

</main>

<footer>
  <p>&copy; 2026 Assistant Virtuel en Comptabilité</p>
</footer>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.4/firebase-app.js";
import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.4/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyAqndA1abN4wy-uCTKyProhdxzm4_mR2Xk",
  authDomain: "virtuel-comptable.firebaseapp.com",
  projectId: "virtuel-comptable",
  storageBucket: "virtuel-comptable.firebasestorage.app",
  messagingSenderId: "192881285900",
  appId: "1:192881285900:web:0b83de32611d1a72194729"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

let lastSendTime = 0;

window.sendMessage = async function(event){
  event.preventDefault();

  const now = Date.now();
  if(now - lastSendTime < 5000){
    alert("⛔ Veuillez attendre 5 secondes");
    return;
  }
  lastSendTime = now;

  const name = document.getElementById("name").value;
  const email = document.getElementById("email").value;
  const message = document.getElementById("message").value;

  const btn = document.getElementById("sendBtn");
  const loader = document.getElementById("loader");
  const successBox = document.getElementById("successBox");

  if(!name || !email || !message){
    alert("Veuillez remplir tous les champs");
    return;
  }

  btn.disabled = true;
  loader.style.display = "block";
  successBox.style.display = "none";

  try {
    await addDoc(collection(db, "contacts"), {
      name,
      email,
      message,
      createdAt: serverTimestamp()
    });

    loader.style.display = "none";
    successBox.style.display = "block";

    document.getElementById("contactForm").reset();

    setTimeout(() => {
      window.location.href = "index.html";
    }, 2500);

  } catch (error) {
    console.error(error);
    alert("Erreur d'envoi ❌");
  }

  btn.disabled = false;
};

</script>

</body>
</html>

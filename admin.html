<!DOCTYPE html>
<html>
<head>
  <title>Admin Dashboard</title>
  <style>
    table { width:100%; border-collapse: collapse; }
    th, td { border:1px solid #ccc; padding:8px; }
    th { background:#333; color:white; }
  </style>
</head>

<body>

<h2>📊 Messages Dashboard</h2>

<input id="search" placeholder="Search email or name">

<table>
  <thead>
    <tr>
      <th>Name</th>
      <th>Email</th>
      <th>Message</th>
      <th>Action</th>
    </tr>
  </thead>

  <tbody id="data"></tbody>
</table>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.4/firebase-app.js";
import {
  getFirestore,
  collection,
  onSnapshot,
  deleteDoc,
  doc
} from "https://www.gstatic.com/firebasejs/10.12.4/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCP_DYHxq5YuWd59nxNFA9Ndz9HlUb2Kk",
  authDomain: "virtuelcomptable.firebaseapp.com",
  projectId: "virtuelcomptable",
  appId: "1:895182788090:web:d6687d8d94effc69f98043"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const tbody = document.getElementById("data");
let allData = [];

function render(data){
  tbody.innerHTML = "";
  data.forEach(d => {
    tbody.innerHTML += `
      <tr>
        <td>${d.name}</td>
        <td>${d.email}</td>
        <td>${d.message}</td>
        <td>
          <button onclick="del('${d.id}')">Delete</button>
        </td>
      </tr>
    `;
  });
}

// REAL-TIME 🔥
onSnapshot(collection(db, "contacts"), (snap) => {
  allData = [];
  snap.forEach(docu => {
    allData.push({ id: docu.id, ...docu.data() });
  });
  render(allData);
});

// DELETE + CONFIRM MODAL SIMPLE
window.del = async function(id){
  if(confirm("Are you sure ?")){
    await deleteDoc(doc(db, "contacts", id));
  }
}

// SEARCH 🔍
document.getElementById("search").addEventListener("input", (e)=>{
  const value = e.target.value.toLowerCase();

  const filtered = allData.filter(d =>
    d.name.toLowerCase().includes(value) ||
    d.email.toLowerCase().includes(value)
  );

  render(filtered);
});

  import { getAuth, onAuthStateChanged } 
from "https://www.gstatic.com/firebasejs/10.12.4/firebase-auth.js";

const auth = getAuth(app);

// 🔐 CHECK LOGIN STATUS
onAuthStateChanged(auth, (user) => {
    if (!user) {
        alert("Accès refusé");
        window.location.href = "login.html";
    }
});
</script>

</body>
</html>

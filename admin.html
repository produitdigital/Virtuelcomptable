<!DOCTYPE html>
<html>
<head>
  <title>Admin Dashboard PRO</title>

  <style>
    body { font-family: Arial; padding: 10px; }
    table { width:100%; border-collapse: collapse; margin-top:10px; }
    th, td { border:1px solid #ccc; padding:8px; }
    th { background:#333; color:#fff; }
    button { padding:5px; margin:2px; cursor:pointer; }
    #pagination button { padding:5px 10px; }
    .topbar { display:flex; gap:10px; flex-wrap:wrap; margin-bottom:10px; }
    input { padding:6px; }
  </style>
</head>

<body>

<h2>📊 Admin Messages Dashboard PRO</h2>

<!-- 🔐 FILTER + SEARCH -->
<div class="topbar">
  <input id="search" placeholder="Search name/email">

  <input type="date" id="dateFilter">

  <button onclick="exportCSV()">📥 Export CSV</button>
</div>

<table>
  <thead>
    <tr>
      <th>Name</th>
      <th>Email</th>
      <th>Message</th>
      <th>Date</th>
      <th>Action</th>
    </tr>
  </thead>

  <tbody id="data"></tbody>
</table>

<div id="pagination"></div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.4/firebase-app.js";
import {
  getFirestore,
  collection,
  onSnapshot,
  deleteDoc,
  doc
} from "https://www.gstatic.com/firebasejs/10.12.4/firebase-firestore.js";

import {
  getAuth,
  onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.12.4/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyAqndA1abN4wy-uCTKyProhdxzm4_mR2Xk",
  authDomain: "virtuel-comptable.firebaseapp.com",
  projectId: "virtuel-comptable",
  appId: "1:192881285900:web:0b83de32611d1a72194729"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);

let allData = [];
let currentPage = 1;
const pageSize = 10;

// 🔥 RENDER TABLE
function render(data){

  const tbody = document.getElementById("data");
  tbody.innerHTML = "";

  const start = (currentPage - 1) * pageSize;
  const end = start + pageSize;

  const pageData = data.slice(start, end);

  pageData.forEach(d => {
    tbody.innerHTML += `
      <tr>
        <td>${d.name || ""}</td>
        <td>${d.email || ""}</td>
        <td>${d.message || ""}</td>
        <td>
          ${
            d.createdAt
              ? new Date(d.createdAt.seconds * 1000).toLocaleString()
              : ""
          }
        </td>
        <td>
          <button onclick="del('${d.id}')">Delete</button>
        </td>
      </tr>
    `;
  });

  renderPagination(data);
}

// 🔥 REALTIME FIRESTORE
onSnapshot(collection(db, "contacts"), (snap) => {
  allData = [];

  snap.forEach(docu => {
    allData.push({ id: docu.id, ...docu.data() });
  });

  applyFilters();
});

// 🔍 SEARCH + DATE FILTER
function applyFilters(){

  const searchValue = document.getElementById("search").value.toLowerCase();
  const dateValue = document.getElementById("dateFilter").value;

  let filtered = allData;

  // SEARCH
  if(searchValue){
    filtered = filtered.filter(d =>
      (d.name || "").toLowerCase().includes(searchValue) ||
      (d.email || "").toLowerCase().includes(searchValue)
    );
  }

  // DATE FILTER
  if(dateValue){
    filtered = filtered.filter(d => {
      if(!d.createdAt) return false;
      const dDate = new Date(d.createdAt.seconds * 1000);
      return dDate.toISOString().split("T")[0] === dateValue;
    });
  }

  render(filtered);
}

// EVENTS
document.getElementById("search").addEventListener("input", ()=>{
  currentPage = 1;
  applyFilters();
});

document.getElementById("dateFilter").addEventListener("change", ()=>{
  currentPage = 1;
  applyFilters();
});

// 🗑️ DELETE
window.del = async function(id){
  if(confirm("Delete this message?")){
    await deleteDoc(doc(db, "contacts", id));
  }
}

// 📄 PAGINATION
function renderPagination(data){

  const container = document.getElementById("pagination");
  container.innerHTML = "";

  const totalPages = Math.ceil(data.length / pageSize);

  for(let i=1; i<=totalPages; i++){
    container.innerHTML += `
      <button onclick="goToPage(${i})"
      style="${i===currentPage?'background:black;color:white':''}">
        ${i}
      </button>
    `;
  }
}

window.goToPage = function(page){
  currentPage = page;
  applyFilters();
}

// 📥 EXPORT CSV
window.exportCSV = function(){

  let csv = "Name,Email,Message,Date\n";

  allData.forEach(d => {
    csv += `"${d.name || ""}","${d.email || ""}","${d.message || ""}","${
      d.createdAt ? new Date(d.createdAt.seconds * 1000).toLocaleString() : ""
    }"\n`;
  });

  const blob = new Blob([csv], { type: "text/csv" });
  const url = URL.createObjectURL(blob);

  const a = document.createElement("a");
  a.href = url;
  a.download = "messages.csv";
  a.click();

  URL.revokeObjectURL(url);
}

// 🔐 SIMPLE ADMIN LOGIN (ROLE SYSTEM BASIC)
onAuthStateChanged(auth, (user) => {

  if(!user){
    alert("Accès refusé");
    window.location.href = "login.html";
    return;
  }

  // ROLE CHECK (simple example)
  onAuthStateChanged(auth, (user) => {

  if (!user) {
    alert("Accès refusé");
    window.location.href = "login.html";
    return;
  }

  const admins = [
    "rasolojean44@gmail.com",
    "rjeantsioriniaina@gmail.com"
  ];

  const email = (user.email || "").trim().toLowerCase();

  if (!admins.includes(email)) {
    alert("Not admin");
    window.location.href = "index.html";
  }
});
</script>

</body>
</html>
